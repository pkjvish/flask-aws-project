version: 0.2

env:
  variables:
    AWS_REGION: ap-south-1
    AWS_ACCOUNT_ID: '135306227278'
    ECR_REPO: flask-secure-stack-ecr-repo
    STACK_NAME: flask-secure-stack
    CLUSTER_NAME: flask-secure-stack-cluster
    SERVICE_NAME: flask-secure-stack-service
    DATABASE_NAME: crud_db

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "[install] runtime ready"

  pre_build:
    commands:
      - echo "[pre_build] Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - export ECR_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO
      - export COMMIT_SHA=$(echo ${CODEBUILD_RESOLVED_SOURCE_VERSION:-$(git rev-parse --short HEAD)} | cut -c1-7)
      - echo "[pre_build] ECR URI = $ECR_URI"
      - echo "[pre_build] Commit SHA = $COMMIT_SHA"
      - |
        echo "[pre_build] Checking CloudFormation stack and ECS service state..."
        STACK_STATUS=$(aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "Stacks[0].StackStatus" \
          --output text 2>/dev/null || echo "DOES_NOT_EXIST")
        echo "[pre_build] Stack status: $STACK_STATUS"
        if [ "$STACK_STATUS" = "DOES_NOT_EXIST" ]; then
          export STACK_EXISTS=false
        else
          export STACK_EXISTS=true
        fi

        if [ "$STACK_EXISTS" = "true" ]; then
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --region "$AWS_REGION" \
            --query "services[0].status" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          echo "[pre_build] ECS service status: $SERVICE_STATUS"
          if [ "$SERVICE_STATUS" = "ACTIVE" ]; then
            PREVIOUS_TASK_DEF_ARN=$(aws ecs describe-services \
              --cluster "$CLUSTER_NAME" \
              --services "$SERVICE_NAME" \
              --region "$AWS_REGION" \
              --query "services[0].taskDefinition" \
              --output text)
            echo "[pre_build] Current task definition ARN: $PREVIOUS_TASK_DEF_ARN"
            export PREVIOUS_TASK_DEF_ARN
            PREVIOUS_IMAGE=$(aws ecs describe-task-definition \
              --task-definition "$PREVIOUS_TASK_DEF_ARN" \
              --region "$AWS_REGION" \
              --query "taskDefinition.containerDefinitions[0].image" \
              --output text)
            echo "[pre_build] Previous image: $PREVIOUS_IMAGE"
            export PREVIOUS_IMAGE
            aws ecs update-service \
              --cluster "$CLUSTER_NAME" \
              --service "$SERVICE_NAME" \
              --deployment-configuration minimumHealthyPercent=0,maximumPercent=100 \
              --region "$AWS_REGION" || true
          fi
        fi

      - echo "export ECR_URI=$ECR_URI" >> /tmp/build_env
      - echo "export COMMIT_SHA=$COMMIT_SHA" >> /tmp/build_env
      - echo "export STACK_EXISTS=$STACK_EXISTS" >> /tmp/build_env
      - echo "export STACK_STATUS=$STACK_STATUS" >> /tmp/build_env
      - echo "export CLUSTER_NAME=$CLUSTER_NAME" >> /tmp/build_env
      - echo "export SERVICE_NAME=$SERVICE_NAME" >> /tmp/build_env
      - echo "export AWS_REGION=$AWS_REGION" >> /tmp/build_env
      - echo "export AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> /tmp/build_env
      - echo "export ECR_REPO=$ECR_REPO" >> /tmp/build_env
      - echo "export DATABASE_NAME=$DATABASE_NAME" >> /tmp/build_env
      - |
        if [ -n "${PREVIOUS_TASK_DEF_ARN:-}" ]; then
          echo "export PREVIOUS_TASK_DEF_ARN=$PREVIOUS_TASK_DEF_ARN" >> /tmp/build_env
        fi
      - |
        if [ -n "${PREVIOUS_IMAGE:-}" ]; then
          echo "export PREVIOUS_IMAGE=$PREVIOUS_IMAGE" >> /tmp/build_env
        fi

  build:
    commands:
      - . /tmp/build_env
      - |
        if [ "$STACK_EXISTS" != "true" ]; then
          echo "[build] First-time deployment: creating base CloudFormation stack (service disabled)"
          DEPLOY_OUTPUT=$(aws cloudformation deploy \
            --template-file .aws/cloudformation.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides DeployService=false AppImage="public.ecr.aws/docker/library/python:3.11-slim" SecureDBName="$DATABASE_NAME" 2>&1)
          DEPLOY_EXIT=$?
          echo "$DEPLOY_OUTPUT"
          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "[build] ERROR: CloudFormation deploy failed with exit code $DEPLOY_EXIT"
            exit 1
          fi
          echo "[build] CloudFormation deploy command succeeded; waiting for stack completion..."
          if ! aws cloudformation wait stack-create-complete --stack-name "$STACK_NAME" --region "$AWS_REGION" 2>&1; then
            echo "[build] ERROR: Stack creation did not complete successfully"
            FINAL_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].StackStatus" --output text 2>&1)
            echo "[build] Final stack status: $FINAL_STATUS"
            exit 1
          fi
          echo "[build] Base stack created successfully"
        fi
      - |
        echo "[build] Verifying CloudFormation stack exists..."
        VERIFY_STACK=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].StackStatus" --output text 2>&1)
        echo "[build] Stack status: $VERIFY_STACK"
        if ! echo "$VERIFY_STACK" | grep -qE "CREATE_COMPLETE|UPDATE_COMPLETE"; then
          echo "[build] ERROR: Stack exists but status is not ready: $VERIFY_STACK"
          exit 1
        fi
      - |
        echo "[build] Verifying ECR repository exists before push..."
        if ! aws ecr describe-repositories --repository-names "$ECR_REPO" --region "$AWS_REGION" >/dev/null 2>&1; then
          echo "[build] ERROR: ECR repository $ECR_REPO does not exist"
          echo "[build] Stack creation may have failed silently; check CloudFormation events"
          exit 1
        fi
        echo "[build] ECR repository verified: $ECR_REPO"
      - echo "[build] Building Docker image..."
      - docker build -t "$ECR_REPO:latest" .
      - docker tag "$ECR_REPO:latest" "$ECR_URI:latest"
      - docker tag "$ECR_REPO:latest" "$ECR_REPO:$COMMIT_SHA"
      - echo "[build] Pushing Docker images to ECR..."
      - docker push "$ECR_URI:latest"
      - docker push "$ECR_URI:$COMMIT_SHA"
      - |
        if [ "$STACK_EXISTS" != "true" ]; then
          echo "[build] Enabling ECS service by updating CloudFormation stack with new image"
          DEPLOY_OUTPUT=$(aws cloudformation deploy \
            --template-file .aws/cloudformation.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides DeployService=true AppImage="$ECR_URI:$COMMIT_SHA" SecureDBName="$DATABASE_NAME" 2>&1)
          DEPLOY_EXIT=$?
          echo "$DEPLOY_OUTPUT"
          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "[build] ERROR: CloudFormation stack update failed with exit code $DEPLOY_EXIT"
            exit 1
          fi
          echo "[build] CloudFormation update succeeded; waiting for stack update..."
          if ! aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME" --region "$AWS_REGION" 2>&1; then
            echo "[build] ERROR: Stack update did not complete successfully"
            FINAL_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].StackStatus" --output text 2>&1)
            echo "[build] Final stack status: $FINAL_STATUS"
            exit 1
          fi
          echo "[build] ECS service deployment completed"
        else
          if [ -z "${PREVIOUS_TASK_DEF_ARN:-}" ]; then
            echo "[build] Existing stack without prior task definition. Performing CloudFormation service update."
            DEPLOY_OUTPUT=$(aws cloudformation deploy \
              --template-file .aws/cloudformation.yaml \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --capabilities CAPABILITY_IAM \
              --parameter-overrides DeployService=true AppImage="$ECR_URI:$COMMIT_SHA" SecureDBName="$DATABASE_NAME" 2>&1)
            DEPLOY_EXIT=$?
            echo "$DEPLOY_OUTPUT"
            if [ $DEPLOY_EXIT -ne 0 ]; then
              echo "[build] ERROR: CloudFormation update failed with exit code $DEPLOY_EXIT"
              exit 1
            fi
            if ! aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME" --region "$AWS_REGION" 2>&1; then
              echo "[build] ERROR: Stack update did not complete"
              exit 1
            fi
          else
            export NEW_IMAGE="$ECR_URI:$COMMIT_SHA"
            echo "[build] Updating existing ECS service with new task definition (image: $NEW_IMAGE)"
            aws ecs describe-task-definition \
              --task-definition "$PREVIOUS_TASK_DEF_ARN" \
              --region "$AWS_REGION" \
              --query "taskDefinition" \
              --output json > /tmp/current-task-def.json
            python3 - <<'PY'
              import json, os
              with open('/tmp/current-task-def.json') as f:
                  data = json.load(f)
              for k in ['taskDefinitionArn', 'revision', 'status', 'registeredAt', 'registeredBy', 'compatibilities', 'requiresAttributes']:
                  data.pop(k, None)
              for container in data.get('containerDefinitions', []):
                  if container.get('name') == 'flask-container':
                      container['image'] = os.environ['NEW_IMAGE']
              with open('/tmp/new-task-def.json', 'w') as f:
                  json.dump(data, f)
            PY
            NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
              --cli-input-json file:///tmp/new-task-def.json \
              --region "$AWS_REGION" \
              --query "taskDefinition.taskDefinitionArn" --output text)
            echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> /tmp/build_env
            echo "[build] Registered new task definition: $NEW_TASK_DEF_ARN"
            echo "[build] Updating ECS service to use new task definition"
            aws ecs update-service \
              --cluster "$CLUSTER_NAME" \
              --service "$SERVICE_NAME" \
              --task-definition "$NEW_TASK_DEF_ARN" \
              --deployment-configuration minimumHealthyPercent=0,maximumPercent=100 \
              --force-new-deployment \
              --region "$AWS_REGION" || {
              echo "[build] ERROR: Failed to update ECS service"
              exit 1
            }
          fi
        fi

  post_build:
    commands:
      - . /tmp/build_env
      - echo "[post_build] Waiting for ECS service to stabilize..."
      - |
        TIMEOUT_SECONDS=300
        INTERVAL_SECONDS=10
        ELAPSED=0
        FAILED=0
        SUCCESS=0
        while [ $ELAPSED -lt $TIMEOUT_SECONDS ]; do
          STATUS_JSON=$(aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --region "$AWS_REGION" \
            --query "services[0]" \
            --output json 2>/dev/null || echo '{}')
          if [ -z "$STATUS_JSON" ] || [ "$STATUS_JSON" = "null" ] || [ "$STATUS_JSON" = "{}" ]; then
            echo "[post_build] ECS service not found; cluster may not be ready yet"
            sleep $INTERVAL_SECONDS
            ELAPSED=$((ELAPSED + INTERVAL_SECONDS))
            continue
          fi
          ROLLOUT_STATE=$(echo "$STATUS_JSON" | python3 -c "import sys, json; d=json.load(sys.stdin); print((d.get('deployments') or [{}])[-1].get('rolloutState','UNKNOWN'))")
          RUNNING_COUNT=$(echo "$STATUS_JSON" | python3 -c "import sys, json; d=json.load(sys.stdin); print((d.get('deployments') or [{}])[-1].get('runningCount',0))")
          DESIRED_COUNT=$(echo "$STATUS_JSON" | python3 -c "import sys, json; d=json.load(sys.stdin); print((d.get('deployments') or [{}])[-1].get('desiredCount',0))")
          echo "[post_build] Rollout=$ROLLOUT_STATE Running=$RUNNING_COUNT Desired=$DESIRED_COUNT"
          if [ "$ROLLOUT_STATE" = "FAILED" ]; then
            echo "[post_build] Deployment failed (rollout state = FAILED)"
            FAILED=1
            break
          fi
          if [ "$ROLLOUT_STATE" = "COMPLETED" ] && [ "$DESIRED_COUNT" -gt 0 ] && [ "$RUNNING_COUNT" -eq "$DESIRED_COUNT" ]; then
            echo "[post_build] Deployment completed successfully"
            SUCCESS=1
            break
          fi
          sleep $INTERVAL_SECONDS
          ELAPSED=$((ELAPSED + INTERVAL_SECONDS))
        done
        if [ $SUCCESS -ne 1 ]; then
          echo "[post_build] Deployment failed or timed out. Starting rollback..."
          if [ "${STACK_EXISTS:-false}" != "true" ]; then
            echo "[post_build] Removing newly-created CloudFormation stack..."
            aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$AWS_REGION"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" --region "$AWS_REGION"
          fi
          if [ -n "${PREVIOUS_TASK_DEF_ARN:-}" ]; then
            echo "[post_build] Rolling back ECS service to previous task definition $PREVIOUS_TASK_DEF_ARN"
            aws ecs update-service \
              --cluster "$CLUSTER_NAME" \
              --service "$SERVICE_NAME" \
              --task-definition "$PREVIOUS_TASK_DEF_ARN" \
              --deployment-configuration minimumHealthyPercent=0,maximumPercent=100 \
              --force-new-deployment \
              --region "$AWS_REGION"
            aws ecs wait services-stable --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" --region "$AWS_REGION"
          fi
          if [ -n "${COMMIT_SHA:-}" ]; then
            aws ecr batch-delete-image --repository-name "$ECR_REPO" --image-ids imageTag="$COMMIT_SHA" --region "$AWS_REGION" || true
          fi
          exit 1
        fi
      - echo "[post_build] ECS deployment stabilized successfully."
      - |
        APP_URL=$(aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "Stacks[0].Outputs[?OutputKey=='ExternalUrl'].OutputValue" \
          --output text)
        echo "Application live at: $APP_URL"
      - |
        TASK_ARN=$(aws ecs list-tasks \
          --cluster "$CLUSTER_NAME" \
          --service-name "$SERVICE_NAME" \
          --region "$AWS_REGION" \
          --query 'taskArns[0]' --output text)
        echo "[post_build] Task ARN: $TASK_ARN"
        if [ "$TASK_ARN" != "None" ] && [ -n "$TASK_ARN" ]; then
          TASK_ID=$(echo "$TASK_ARN" | awk -F'/' '{print $NF}')
          LOG_GROUP="/ecs/${STACK_NAME}-container-app"
          LOG_STREAM="secureapp/flask-container/$TASK_ID"
          echo "[post_build] Fetching logs from $LOG_GROUP / $LOG_STREAM"
          aws logs get-log-events --log-group-name "$LOG_GROUP" --log-stream-name "$LOG_STREAM" --region "$AWS_REGION" --limit 50 --query 'events[*].message' --output text 2>/dev/null || echo "No logs found yet"
        fi
