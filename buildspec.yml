version: 0.2

env:
  variables:
    AWS_REGION: ap-south-1 
    AWS_ACCOUNT_ID: '135306227278'
    ECR_REPO: dynamic-secure-app
    STACK_NAME: flask-secure-stack
    CLUSTER_NAME: DynamicSecureCluster
    SERVICE_NAME: flask-service

phases:

  pre_build:
    commands:
      # ── Authenticate Docker to ECR ────────────────────────────────────
      - echo "[pre_build] Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - export ECR_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO
      - export COMMIT_SHA=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - echo "[pre_build] ECR URI = $ECR_URI"
      - echo "[pre_build] Commit SHA = $COMMIT_SHA"

      # ── Check and wait for stack to be stable ────────────────────────
      - |
        #!/bin/bash
        echo "[pre_build] Checking CloudFormation stack status..."
        while true; do
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --region $AWS_REGION \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          echo "Stack status: $STATUS"
          case $STATUS in
            DOES_NOT_EXIST)
              echo "Stack does not exist. Will create fresh."
              break
              ;;
            *_IN_PROGRESS)
              echo "Stack busy ($STATUS), waiting 15 seconds..."
              sleep 15
              ;;
            *)
              echo "Stack is stable at: $STATUS"
              break
              ;;
          esac
        done

        if [ "$STATUS" = "CREATE_COMPLETE" ] || [ "$STATUS" = "UPDATE_COMPLETE" ] || [ "$STATUS" = "UPDATE_ROLLBACK_COMPLETE" ]; then
          export IAC_EXISTS=true
        else
          export IAC_EXISTS=false
        fi

        echo "export ECR_URI=$ECR_URI"         >> /tmp/build_env
        echo "export COMMIT_SHA=$COMMIT_SHA"   >> /tmp/build_env
        echo "export IAC_EXISTS=$IAC_EXISTS"   >> /tmp/build_env
        echo "export STACK_STATUS=$STATUS"     >> /tmp/build_env
        echo "[pre_build] Done. IAC_EXISTS=$IAC_EXISTS"
        cat /tmp/build_env

  build:
    commands:
      # ── Load env from pre_build ───────────────────────────────────────
      - . /tmp/build_env

      # ── Deploy base infrastructure only if stack does not exist ───────
      - |
        #!/bin/bash
        . /tmp/build_env
        if [ "$IAC_EXISTS" = "false" ]; then
          echo "[build] Stack not found. Deploying base infrastructure..."
          aws cloudformation deploy \
            --template-file .aws/cloudformation.yaml \
            --stack-name $STACK_NAME \
            --region $AWS_REGION \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides DeployService=false \
            --no-fail-on-empty-changeset

          echo "[build] Waiting for base stack to stabilize..."
          aws cloudformation wait stack-create-complete \
            --stack-name $STACK_NAME --region $AWS_REGION || \
          aws cloudformation wait stack-update-complete \
            --stack-name $STACK_NAME --region $AWS_REGION

          echo "[build] Base infrastructure ready."
        else
          echo "[build] Stack already exists ($STACK_STATUS). Skipping IaC deploy."
        fi

      # ── Build Docker image ────────────────────────────────────────────
      - echo "[build] Building Docker image..."
      - docker build -t $ECR_REPO:latest .

      # ── Tag and push to ECR ───────────────────────────────────────────
      - . /tmp/build_env
      - echo "[build] Pushing image to ECR..."
      - docker tag $ECR_REPO:latest $ECR_URI:latest
      - docker tag $ECR_REPO:latest $ECR_URI:$COMMIT_SHA
      - docker push $ECR_URI:latest
      - docker push $ECR_URI:$COMMIT_SHA
      - echo "[build] Image pushed successfully."

  post_build:
    commands:
      # ── Load env from pre_build ───────────────────────────────────────
      - . /tmp/build_env

      # ── Deploy ECS Service via CloudFormation ─────────────────────────
      - echo "[post_build] Deploying ECS Service..."
      - |
        . /tmp/build_env
        aws cloudformation deploy \
          --template-file .aws/cloudformation.yaml \
          --stack-name $STACK_NAME \
          --region $AWS_REGION \
          --capabilities CAPABILITY_IAM \
          --parameter-overrides DeployService=true AppImage=$ECR_URI:latest \
          --no-fail-on-empty-changeset

      # ── Force new ECS deployment to pull latest image ─────────────────
      - echo "[post_build] Waiting for ECS service to become ACTIVE..."
      - |
        while true; do
          SVC_STATUS=$(aws ecs describe-services \
            --cluster $CLUSTER_NAME \
            --services $SERVICE_NAME \
            --region $AWS_REGION \
            --query "services[0].status" \
            --output text 2>/dev/null || echo "UNKNOWN")
          echo "ECS Service status: $SVC_STATUS"
          if [ "$SVC_STATUS" = "ACTIVE" ]; then
            break
          fi
          echo "Waiting 10 seconds..."
          sleep 10
        done
      - echo "[post_build] Forcing new ECS deployment..."
      - |
        aws ecs update-service \
          --cluster $CLUSTER_NAME \
          --service $SERVICE_NAME \
          --force-new-deployment \
          --region $AWS_REGION

      # ── Wait for ECS tasks to stabilize ──────────────────────────────
      - echo "[post_build] Waiting for ECS service to stabilize..."
      - |
        aws ecs wait services-stable \
          --cluster $CLUSTER_NAME \
          --services $SERVICE_NAME \
          --region $AWS_REGION

      # ── Print application URL ─────────────────────────────────────────
      - |
        URL=$(aws cloudformation describe-stacks \
          --stack-name $STACK_NAME \
          --region $AWS_REGION \
          --query "Stacks[0].Outputs[?OutputKey=='ExternalUrl'].OutputValue" \
          --output text)
        echo "=========================================="
        echo "Application is live at: $URL"
        echo "=========================================="

      # ── Fetch ECS container logs ──────────────────────────────────────
      - echo "[post_build] Fetching ECS container logs..."
      - |
        TASK_ARN=$(aws ecs list-tasks \
          --cluster $CLUSTER_NAME \
          --service-name $SERVICE_NAME \
          --region $AWS_REGION \
          --query 'taskArns[0]' --output text)
        echo "Task ARN: $TASK_ARN"
        TASK_ID=$(echo $TASK_ARN | awk -F'/' '{print $NF}')
        aws logs get-log-events \
          --log-group-name /ecs/secure-container-app \
          --log-stream-name secureapp/flask-container/$TASK_ID \
          --region $AWS_REGION \
          --limit 50 \
          --query 'events[*].message' \
          --output text || echo "No logs found yet"
