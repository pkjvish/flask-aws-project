name: Deploy Flask App to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: '135306227278'
  ECR_REPO: dynamic-secure-app
  STACK_NAME: flask-secure-stack
  CLUSTER_NAME: DynamicSecureCluster
  SERVICE_NAME: flask-service

jobs:
  deploy:
    name: Full Sequential Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v3

      # ── 2. Configure AWS credentials ──────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── NEW: Cancel any previous running workflow runs for this branch ─
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      # ── NEW: Ensure ECS service uses only one task at a time ──────────
      #       (minimumHealthyPercent=0, maximumPercent=100)
      - name: Configure ECS deployment (no overlapping tasks)
        run: |
          echo "Checking current deployment configuration for service ${{ env.SERVICE_NAME }}..."
          CURRENT_MIN=$(aws ecs describe-services \
            --cluster ${{ env.CLUSTER_NAME }} \
            --services ${{ env.SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "services[0].deploymentConfiguration.minimumHealthyPercent" \
            --output text 2>/dev/null || echo "NOT_FOUND")
          CURRENT_MAX=$(aws ecs describe-services \
            --cluster ${{ env.CLUSTER_NAME }} \
            --services ${{ env.SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "services[0].deploymentConfiguration.maximumPercent" \
            --output text 2>/dev/null || echo "NOT_FOUND")

          if [[ "$CURRENT_MIN" != "0" ]] || [[ "$CURRENT_MAX" != "100" ]]; then
            echo "Updating service deployment configuration to MinimumHealthyPercent=0, MaximumPercent=100 (zero overlap)..."
            aws ecs update-service \
              --cluster ${{ env.CLUSTER_NAME }} \
              --service ${{ env.SERVICE_NAME }} \
              --deployment-configuration minimumHealthyPercent=0,maximumPercent=100 \
              --region ${{ env.AWS_REGION }}
            echo "Waiting for service to stabilise after configuration change..."
            aws ecs wait services-stable \
              --cluster ${{ env.CLUSTER_NAME }} \
              --services ${{ env.SERVICE_NAME }} \
              --region ${{ env.AWS_REGION }}
          else
            echo "Deployment configuration already correct (min=0, max=100)."
          fi

      # ── 3. Check stack status and wait if in progress ────────────────
      - name: Check stack status
        id: stack-check
        run: |
          echo "Checking stack status..."

          # Wait if stack is in any IN_PROGRESS state
          while true; do
            STATUS=$(aws cloudformation describe-stacks \
              --stack-name ${{ env.STACK_NAME }} \
              --region ${{ env.AWS_REGION }} \
              --query "Stacks[0].StackStatus" \
              --output text 2>/dev/null || echo "DOES_NOT_EXIST")
            echo "Current stack status: $STATUS"

            case $STATUS in
              *_IN_PROGRESS)
                echo "Stack is busy ($STATUS), waiting 15 seconds..."
                sleep 15
                ;;
              *)
                break
                ;;
            esac
          done

          echo "status=$STATUS" >> $GITHUB_OUTPUT

          if [[ "$STATUS" == "CREATE_COMPLETE" || "$STATUS" == "UPDATE_COMPLETE" || "$STATUS" == "UPDATE_ROLLBACK_COMPLETE" ]]; then
            echo "iac_exists=true" >> $GITHUB_OUTPUT
          else
            echo "iac_exists=false" >> $GITHUB_OUTPUT
          fi

      # ── 4. Deploy base infrastructure (only if stack does not exist) ──
      #       Uses placeholder image, ECS Service skipped (DeployService=false)
      - name: Deploy base infrastructure
        if: steps.stack-check.outputs.iac_exists == 'false'
        run: |
          aws cloudformation deploy \
            --template-file .aws/cloudformation.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides DeployService=false \
            --no-fail-on-empty-changeset

      # ── 5. Wait for base stack to stabilize (only on fresh deploy) ────
      - name: Wait for base stack to stabilize
        if: steps.stack-check.outputs.iac_exists == 'false'
        run: |
          aws cloudformation wait stack-create-complete \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} || \
          aws cloudformation wait stack-update-complete \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }}

      # ── 6. Authenticate Docker to ECR ─────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 7. Build Docker image ─────────────────────────────────────────
      - name: Build Docker image
        run: |
          docker build -t ${{ env.ECR_REPO }}:latest .

      # ── 8. Push image to ECR (overrides :latest on every run) ─────────
      - name: Push image to ECR
        run: |
          ECR_URI=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}
          docker tag ${{ env.ECR_REPO }}:latest $ECR_URI:latest
          docker tag ${{ env.ECR_REPO }}:latest $ECR_URI:${{ github.sha }}
          docker push $ECR_URI:latest
          docker push $ECR_URI:${{ github.sha }}
          echo "ECR_IMAGE=$ECR_URI:latest" >> $GITHUB_ENV

      # ── 9. Deploy or update ECS Service via CloudFormation ────────────
      - name: Deploy ECS Service
        run: |
          aws cloudformation deploy \
            --template-file .aws/cloudformation.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides DeployService=true AppImage=${{ env.ECR_IMAGE }} \
            --no-fail-on-empty-changeset

      # ── 10. Force new ECS deployment to pull latest image ─────────────
      #        This ensures ECS replaces running tasks even if CF had no changes
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.CLUSTER_NAME }} \
            --service ${{ env.SERVICE_NAME }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      # ── 11. Enhanced wait: ensure deployment completes or fail ────────
      - name: Wait for ECS deployment to stabilise (with failure detection)
        run: |
          TIMEOUT_SECONDS=300   # 5 minutes
          INTERVAL_SECONDS=10
          ELAPSED=0

          echo "Waiting for ECS service ${{ env.SERVICE_NAME }} to become stable (timeout=${TIMEOUT_SECONDS}s)..."

          while [ $ELAPSED -lt $TIMEOUT_SECONDS ]; do
            DEPLOYMENTS=$(aws ecs describe-services \
              --cluster ${{ env.CLUSTER_NAME }} \
              --services ${{ env.SERVICE_NAME }} \
              --region ${{ env.AWS_REGION }} \
              --query "services[0].deployments" \
              --output json)

            PRIMARY_DEPLOYMENT=$(echo $DEPLOYMENTS | jq '.[] | select(.status == "PRIMARY")')
            ROLLOUT_STATE=$(echo $PRIMARY_DEPLOYMENT | jq -r '.rolloutState // "UNKNOWN"')
            RUNNING_COUNT=$(echo $PRIMARY_DEPLOYMENT | jq -r '.runningCount // 0')
            DESIRED_COUNT=$(echo $PRIMARY_DEPLOYMENT | jq -r '.desiredCount // 0')

            echo "Rollout state: $ROLLOUT_STATE | Running: $RUNNING_COUNT / Desired: $DESIRED_COUNT"

            if [[ "$ROLLOUT_STATE" == "FAILED" ]]; then
              echo "❌ ECS deployment FAILED."
              TASK_ARN=$(aws ecs list-tasks \
                --cluster ${{ env.CLUSTER_NAME }} \
                --service-name ${{ env.SERVICE_NAME }} \
                --region ${{ env.AWS_REGION }} \
                --query 'taskArns[0]' --output text)
              if [ "$TASK_ARN" != "None" ] && [ "$TASK_ARN" != "" ]; then
                FAILURE_REASON=$(aws ecs describe-tasks \
                  --cluster ${{ env.CLUSTER_NAME }} \
                  --tasks $TASK_ARN \
                  --region ${{ env.AWS_REGION }} \
                  --query 'tasks[0].containers[0].reason' --output text)
                echo "Task failure reason: $FAILURE_REASON"
              fi
              exit 1
            fi

            if [[ "$ROLLOUT_STATE" == "COMPLETED" ]] && [ "$RUNNING_COUNT" -eq "$DESIRED_COUNT" ]; then
              echo "✅ ECS service is stable and all tasks are running."
              break
            fi

            sleep $INTERVAL_SECONDS
            ELAPSED=$((ELAPSED + INTERVAL_SECONDS))
          done

          if [ $ELAPSED -ge $TIMEOUT_SECONDS ]; then
            echo "❌ Timeout waiting for ECS service to stabilise after ${TIMEOUT_SECONDS}s."
            echo "Last known rollout state: $ROLLOUT_STATE | Running: $RUNNING_COUNT / Desired: $DESIRED_COUNT"
            exit 1
          fi

      # ── 12. Print application URL ─────────────────────────────────────
      - name: Print application URL
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='ExternalUrl'].OutputValue" \
            --output text)
          echo "Application is live at: $URL"

      # ── 13. Fetch ECS container logs (always runs) ────────────────────
      - name: Fetch ECS container logs
        if: always()
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster ${{ env.CLUSTER_NAME }} \
            --service-name ${{ env.SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'taskArns[0]' --output text)
          echo "Task ARN: $TASK_ARN"

          TASK_ID=$(echo $TASK_ARN | awk -F'/' '{print $NF}')
          LOG_STREAM="secureapp/flask-container/${TASK_ID}"
          echo "Fetching logs from stream: $LOG_STREAM"

          aws logs get-log-events \
            --log-group-name /ecs/secure-container-app \
            --log-stream-name $LOG_STREAM \
            --region ${{ env.AWS_REGION }} \
            --limit 100 \
            --query 'events[*].message' \
            --output text || echo "No logs found yet"